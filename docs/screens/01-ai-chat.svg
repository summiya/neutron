roke-width="1"/><rect x="493" y="193" width="531" height="77" rx="15" fill="#e9f1ff" stroke="none"/><text x="514" y="222" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#1f355a">How did Q3 revenue change compared to Q2?</text><text x="514" y="249" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#5b7292">Please provide the supporting documents.</text><rect x="278" y="294" width="744" height="322" rx="15" fill="#f9fbfe" stroke="#e5ebf4"/><rect x="297" y="314" width="35" height="35" rx="10" fill="#2565e5" stroke="none"/><text x="306" y="341" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#fff">N</text><text x="346" y="339" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#2450ad">NEUTRON</text><text x="298" y="389" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="800" fill="#1e3352">Q3 revenue increased 12.4% versus Q2.</text><text x="298" y="423" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#4a607e">The main contributors were:</text><text x="313" y="463" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#4a607e">•  Stronger enterprise subscriptions and expansion</text><text x="313" y="496" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#4a607e">•  Improved annual contract renewals</text><text x="313" y="529" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#4a607e">•  Higher engagement across existing accounts</text><rect x="301" y="561" width="187" height="28" rx="14" fill="#eaf2ff" stroke="none"/><text x="315" y="580" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#2766d7">Financial Report • p.6</text><rect x="500" y="561" width="194" height="28" rx="14" fill="#eaf2ff" stroke="none"/><text x="514" y="580" font-family="Arial,Helvetica,sans-serif" font-size="13" 